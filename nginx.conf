server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # ── Security headers (global) ─────────────────────────────────────────────
    # Inherited by all locations that have NO add_header of their own.
    # Must be repeated in locations that DO use add_header (Cache-Control ones).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://aprendiendo1-n8n.qtma3u.easypanel.host https://api.elevenlabs.io wss://api.elevenlabs.io; frame-ancestors 'none'; form-action 'self';" always;

    location ~ /\. {
        return 404;
    }

    # Static discovery files — no add_header → inherits global security headers
    location = /sitemap.xml { try_files $uri =404; }
    location = /robots.txt  { try_files $uri =404; }
    location = /llms.txt    { try_files $uri =404; }

    # JS/CSS/fonts — long cache (must repeat nosniff; document headers not relevant for assets)
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Images — long cache
    location ~* \.(png|jpe?g|gif|svg|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # HTML entry point — short cache (must repeat ALL security headers alongside Cache-Control)
    location = / {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://aprendiendo1-n8n.qtma3u.easypanel.host https://api.elevenlabs.io wss://api.elevenlabs.io; frame-ancestors 'none'; form-action 'self';" always;
        try_files /index.html =404;
    }

    # SPA routes — no add_header → inherit global security headers
    location ~ ^/blog(/.*)?$ {
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        image/svg+xml;
}
